name: meal_tracker_app
description: A comprehensive meal tracking app with AI-powered insights, gamification, and rewards.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  lottie: ^3.0.0
  confetti: ^0.7.0
  percent_indicator: ^4.2.3
  fl_chart: ^0.66.0
  carousel_slider: ^4.2.1
  smooth_page_indicator: ^1.1.0

  # State Management
  provider: ^6.1.1

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.2

  # Camera & Image
  image_picker: ^1.0.7
  camera: ^0.10.5+9
  image: ^4.1.7

  # API & Network
  http: ^1.2.0
  dio: ^5.4.1
  google_generative_ai: ^0.2.2

  # Notifications
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2

  # Charts & Analytics
  syncfusion_flutter_charts: ^24.2.9

  # Health & Fitness APIs
  health: ^10.1.0

  # Date & Time
  intl: ^0.19.0
  timeago: ^3.6.1

  # Utils
  uuid: ^4.3.3
  collection: ^1.18.0

  # In-App Purchases (for revenue)
  in_app_purchase: ^3.1.13

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/

  fonts:
    - family: CustomIcons
      fonts:
        - asset: fonts/CustomIcons.ttf
